<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>육식 레시피</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 50px;
            height: auto;
        }

        .page-title {
            margin: 0;
            font-size: 24px;
        }

        .icon-links {
            display: flex;
            gap: 20px;
        }

        .icon-link img {
            width: 30px;
            height: auto;
        }

        main {
            padding: 20px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .recipe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .recipe-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: block; /* 검색 전에 모두 보이도록 */
        }

        .recipe-card img {
            max-width: 100%;
            height: 200px; /* 이미지 크기 조정 */
            object-fit: cover; /* 이미지를 잘라서 채우도록 설정 */
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .recipe-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .recipe-card p {
            font-size: 16px;
            color: #555;
        }

        .view-recipe-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .view-recipe-button:hover {
            background-color: #555;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .search-bar input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        .search-bar button {
            padding: 10px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .search-bar button:hover {
            background-color: #555;
        }

        @media (max-width: 768px) {
            .icon-links {
                gap: 10px;
            }

            .recipe-card {
                padding: 15px;
            }

            .view-recipe-button {
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="main.html" class="logo-link">
            <img src="로고.jpg" alt="로고" class="logo">
        </a>
        <h1 class="page-title">육식 레시피</h1>
        <div class="icon-links">
            <a href="favorite.html" class="icon-link">
                <img src="즐겨찾기.png" alt="즐겨찾기" class="icon">
            </a>
            <a href="login.html" class="icon-link">
                <img src="회원가입.png" alt="회원가입" class="icon">
            </a>
            <a href="profile.html" class="icon-link">
                <img src="로그인.png" alt="프로필" class="icon">
            </a>
            <a href="community.html" class="icon-link">
                <img src="커뮤니티.png" alt="커뮤니티" class="icon">
            </a>
        </div>
    </header>

    <main>
        <!-- 레시피 검색창 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="레시피 또는 재료를 검색하세요">
            <button id="searchButton">검색</button>
        </div>

        <h2>추천 육식 레시피</h2>
        <div class="recipe-list"></div>

        <!-- 검색 결과 -->
        <div id="searchResults"></div>
    </main>

    <script>
        let recipeData = []; // 서버에서 로드된 레시피를 저장할 배열

        // 레시피 데이터 로드
        fetch('/api/recipes?category=meat')
            .then(response => response.json())
            .then(data => {
                recipeData = data; // 데이터를 전역 변수에 저장
                const recipeList = document.querySelector('.recipe-list');

                // 데이터를 화면에 표시
                data.forEach(recipe => {
                    const recipeCard = createRecipeCard(recipe);
                    recipeList.appendChild(recipeCard);
                });
            })
            .catch(error => {
                console.error('레시피 데이터 로드 오류:', error);
            });

        // 레시피 카드 생성 함수
        function createRecipeCard(recipe) {
            const recipeCard = document.createElement('div');
            recipeCard.classList.add('recipe-card');

            // 레시피 이미지
            if (recipe.image_url) {
                const img = document.createElement('img');
                img.src = `/uploads/${recipe.image_url}`;
                img.alt = recipe.name;
                recipeCard.appendChild(img);
            }

            // 레시피 제목
            const title = document.createElement('h3');
            title.textContent = recipe.name;
            recipeCard.appendChild(title);

            // 레시피 설명
            const description = document.createElement('p');
            description.textContent = recipe.description;
            recipeCard.appendChild(description);

            // 재료 목록
            const ingredients = document.createElement('p');
            ingredients.textContent = `재료: ${recipe.ingredients}`;
            recipeCard.appendChild(ingredients);

            // 조리 시간
            const totalTime = document.createElement('p');
            totalTime.textContent = `조리 시간: ${recipe.total_time}`;
            recipeCard.appendChild(totalTime);

            // 레시피 보기 버튼
            const button = document.createElement('a');
            button.href = `/recipe/${recipe.recipe_id}`;
            button.textContent = '레시피 보기';
            button.classList.add('view-recipe-button');
            recipeCard.appendChild(button);

            return recipeCard;
        }

        // 검색 기능
        document.querySelector('#searchButton').addEventListener('click', () => {
            const query = document.querySelector('#searchInput').value.trim().toLowerCase().replace(/\s+/g, ''); // 띄어쓰기 무시
            const resultsDiv = document.querySelector('#searchResults');
            const recipeList = document.querySelector('.recipe-list');
            resultsDiv.innerHTML = ''; // 이전 검색 결과 초기화

            // 검색어가 없으면 모든 레시피를 표시
            if (!query) {
                recipeList.style.display = 'grid'; // 모든 레시피 보이기
                return;
            }

            // 검색된 레시피만 보이도록 필터링
            const filteredRecipes = recipeData.filter(recipe => {
                const recipeName = recipe.name.replace(/\s+/g, '').toLowerCase();
                const recipeIngredients = recipe.ingredients.replace(/\s+/g, '').toLowerCase();
                return recipeName.includes(query) || recipeIngredients.includes(query);
            });

            // 필터링된 레시피가 없으면 검색 결과 없음
            if (filteredRecipes.length === 0) {
                resultsDiv.innerHTML = '<p>검색 결과가 없습니다.</p>';
            } else {
                recipeList.style.display = 'none'; // 모든 레시피 숨기기
                filteredRecipes.forEach(recipe => {
                    const recipeCard = createRecipeCard(recipe);
                    resultsDiv.appendChild(recipeCard);
                    recipeCard.style.display = 'block'; // 검색된 레시피 보이기
                });
            }
        });
    </script>
</body>
</html>
