<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 레시피 추가하기</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        /* 공통 스타일 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #f7f9fc, #eaf0f7);
            color: #333;
        }

        /* 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #fcf3a7;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-container img {
            height: 40px;
        }

        .icon-links {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icon-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #f0f4fa;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, background-color 0.3s;
        }

        .icon-link img {
            width: 24px;
            height: 24px;
        }

        .icon-link:hover {
            transform: scale(1.1);
            background-color: #007bff;
        }

        /* 메인 섹션 */
        main {
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            max-width: 600px; /* 폼 너비 줄이기 */
            width: 100%;
            background-color: #fff;
            padding: 20px; /* 폼 패딩 줄이기 */
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        form h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px; /* 마진 줄이기 */
            font-size: 20px; /* 제목 크기 줄이기 */
        }

        /* input-box */
        .input-box {
            margin-bottom: 15px; /* 입력 박스 마진 줄이기 */
            padding: 12px; /* 패딩 줄이기 */
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .input-box label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px; /* 라벨 마진 줄이기 */
            color: #555;
            font-size: 14px; /* 라벨 크기 줄이기 */
        }

        .input-box input,
        .input-box textarea,
        .input-box select {
            width: 100%;
            padding: 10px; /* 입력 필드 패딩 줄이기 */
            font-size: 14px; /* 폰트 크기 줄이기 */
            border: 1px solid #ddd;
            border-radius: 6px; /* 입력 필드 테두리 반지름 줄이기 */
            background-color: #fff;
            transition: border-color 0.3s, box-shadow 0.3s;
            box-sizing: border-box;
        }

        .input-box input:focus,
        .input-box textarea:focus,
        .input-box select:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.2);
        }

        .input-box textarea {
            resize: none;
            height: 100px; /* 텍스트 영역 높이 줄이기 */
        }

        /* 파일 업로드 */
        input[type="file"] {
            padding: 5px;
            background-color: transparent;
        }

        .image-preview {
            margin-top: 10px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            background-color: #f5f7fa;
            text-align: center;
            max-height: 200px; /* 이미지 미리보기 크기 줄이기 */
            overflow: hidden;
            padding: 8px;
            display: none;
        }

        .image-preview img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .remove-image {
            margin-top: 8px; /* 삭제 버튼 마진 줄이기 */
            color: #ff4d4d;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 버튼 */
        button {
            width: 100%;
            padding: 12px; /* 버튼 패딩 줄이기 */
            font-size: 16px; /* 버튼 폰트 크기 줄이기 */
            font-weight: bold;
            color: #fff;
            background: linear-gradient(to right, #007bff, #0056d2);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button:hover {
            background: linear-gradient(to right, #0056d2, #003a92);
            transform: scale(1.02);
        }

        /* 반응형 */
        @media (max-width: 768px) {
            form {
                width: 95%;
            }

            header {
                flex-wrap: wrap;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <a href="main.html">
                <img src="../images/로고.png" alt="로고">
            </a>
        </div>
        <div class="icon-links">
            <a href="favorite.html" class="icon-link">
                <img src="../images/즐겨찾기.png" alt="즐겨찾기">
            </a>
            <a href="signup.html" class="icon-link">
                <img src="../images/회원가입.png" alt="회원가입">
            </a>
            <a href="login.html" class="icon-link">
                <img src="../images/로그인.png" alt="로그인">
            </a>
            <a href="community.html" class="icon-link">
                <img src="../images/커뮤니티.png" alt="커뮤니티">
            </a>
        </div>
    </header>

    <main>
        <form id="recipe-form">
            <h2>나만의 레시피 추가하기</h2>

            <div class="input-box">
                <label for="recipe-name">레시피 이름</label>
                <input type="text" id="recipe-name" name="recipeName" placeholder="레시피 이름을 입력하세요" required>
            </div>

            <div class="input-box">
                <label for="description">요리 설명</label>
                <textarea id="description" name="description" placeholder="요리에 대한 설명을 입력하세요" required></textarea>
            </div>

            <div class="input-box">
                <label for="ingredients">재료 목록 (쉼표로 구분)</label>
                <textarea id="ingredients" name="ingredients" placeholder="예: 양파, 마늘, 고추" required></textarea>
            </div>

            <div class="input-box">
                <label for="instructions">조리 방법</label>
                <textarea id="instructions" name="instructions" placeholder="조리 방법을 자세히 입력하세요" required></textarea>
            </div>

            <div class="input-box">
                <label for="cooking-time">조리 시간 (분)</label>
                <input type="number" id="cooking-time" name="totalTime" min="1" placeholder="조리 시간을 입력하세요" required>
            </div>

            <div class="input-box">
                <label for="difficulty">난이도</label>
                <select id="difficulty" name="difficulty" required>
                    <option value="">난이도를 선택하세요</option>
                    <option value="Easy">쉬움</option>
                    <option value="Medium">보통</option>
                    <option value="Hard">어려움</option>
                </select>
            </div>

            <div class="input-box">
                <label for="recipe-photo">레시피 사진</label>
                <input type="file" id="recipe-photo" name="recipePhoto" accept="image/*">
                <div class="image-preview" id="image-preview">
                    <img id="preview-img" src="#" alt="이미지 미리보기">
                    <p id="remove-image" class="remove-image" style="display:none;">삭제</p>
                </div>
            </div>

            <button type="submit">레시피 추가하기</button>
        </form>
    </main>

    <script>
        const recipePhotoInput = document.getElementById('recipe-photo');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const removeImageBtn = document.getElementById('remove-image');

        recipePhotoInput.addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    previewImg.src = e.target.result;
                    imagePreview.style.display = 'block';
                    removeImageBtn.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        removeImageBtn.addEventListener('click', function () {
            recipePhotoInput.value = '';
            imagePreview.style.display = 'none';
            removeImageBtn.style.display = 'none';
        });

        document.getElementById('recipe-form').addEventListener('submit', function (event) {
            event.preventDefault();
            alert('레시피가 성공적으로 추가되었습니다!');
            document.getElementById('recipe-form').reset();
            imagePreview.style.display = 'none';
        });
    </script>
</body>
</html>
