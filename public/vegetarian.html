<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채식 레시피</title>

<style>
 <style>
        /* 기본적인 스타일 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #fafafa; /* 더 밝은 회색 */
            color: #555; /* 텍스트 색상: 조금 더 연한 회색 */
        }

        .container {
            width: 80%;
            margin: 0 auto;
        }

        header {
            background-color: #ffe3f9; /* 더 부드럽고 연한 핑크 */
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0; /* 밝은 회색 */
        }

        .logo-link img {
            width: 240px; /* 로고 크기 키우기 */
            height: auto;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        nav a {
            margin-left: 10px;
        }

        nav a img {
            width: 30px; /* 아이콘의 너비 설정 */
            height: auto; /* 비율을 유지하며 높이 조정 */
        }

        nav a:hover img {
            opacity: 0.8; /* 호버시 이미지 투명도 조정 */
        }

        main {
            padding: 30px 0;
        }

        .btn {
            background-color: #f8b8c5; /* 연한 핑크 */
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn:hover {
            background-color: #f5a5b4; /* 좀 더 진한 핑크 */
            transform: translateY(-2px);
        }

        /* 레시피 카드 스타일 */
        .recipe-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
            padding: 0 20px; /* 좌우 패딩 추가 */
        }

        .recipe-card {
            background-color: white;
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .recipe-card img {
            max-width: 100%; /* 카드의 너비에 맞게 조정 */
            height: auto; /* 비율을 유지하며 높이 조정 */
            object-fit: cover; /* 이미지를 잘라서 카드에 맞춰 채우도록 설정 */
            border-radius: 8px;
            margin-bottom: 10px;
            max-height: 200px; /* 최대 높이를 설정하여 카드의 일관성을 유지 */
        }

        .recipe-card h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .recipe-card p {
            font-size: 16px;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #f8b8c5; /* 부드러운 연한 핑크 */
            color: white;
            border-top: 1px solid #e0e0e0;
        }

        /* 검색 바 스타일 */
        .search-bar {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .search-bar input {
            padding: 10px;
            width: 300px;
            font-size: 16px;
        }

        .search-bar button {
            padding: 10px;
            font-size: 16px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .search-bar button:hover {
            background-color: #555;
        }

        @media (max-width: 768px) {
            .menu-item {
                width: 220px; /* 작은 화면에서 이미지 크기 조정 */
                height: 150px; /* 작은 화면에서 이미지 크기 조정 */
            }
        }
    </style>

</head>
<body>
    <header>
        <div class="container">
            <a href="main.html" class="logo-link" aria-label="홈으로 이동">
                <img src="로고.png" alt="Logo" id="logo">
            </a>
            <nav id="top-nav">
                <a href="favorite.html" title="즐겨찾기"><img src="즐겨찾기.png" alt="즐겨찾기 
아이콘"></a>
                <a href="profile.html" title="프로필"><img src="회원가입.png" alt="프로필 아이콘"></a>
                <a href="login.html" title="로그인"><img src="로그인.png" alt="로그인 아이콘"></a>
                <a href="community.html" title="커뮤니티"><img src="커뮤니티.png" alt="커뮤니티 
아이콘"></a>
            </nav>
        </div>
    </header>

    <main>
        <!-- 레시피 검색창 -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="레시피 또는 재료를 검색하세요">
            <button id="searchButton">검색</button>
        </div>

        <h2>추천 채식 레시피</h2>
        <div class="recipe-list"></div>

        <!-- 검색 결과 -->
        <div id="searchResults"></div>
    </main>

    <script>
        let recipeData = []; // 서버에서 로드된 레시피를 저장할 배열

        // 레시피 데이터 로드
        fetch('/api/recipes?category=vegetarian') // 채식 레시피 API 요청
            .then(response => response.json())
            .then(data => {
                recipeData = data; // 데이터를 전역 변수에 저장
                const recipeList = document.querySelector('.recipe-list');

                // 데이터를 화면에 표시
                data.forEach(recipe => {
                    const recipeCard = createRecipeCard(recipe);
                    recipeList.appendChild(recipeCard);
                });
            })
            .catch(error => {
                console.error('레시피 데이터 로드 오류:', error);
            });

        // 레시피 카드 생성 함수
        function createRecipeCard(recipe) {
            const recipeCard = document.createElement('div');
            recipeCard.classList.add('recipe-card');

            // 레시피 이미지
            if (recipe.image_url) {
                const img = document.createElement('img');
                img.src = `/uploads/${recipe.image_url}`;
                img.alt = recipe.name;
                recipeCard.appendChild(img);
            }

            // 레시피 제목
            const title = document.createElement('h3');
            title.textContent = recipe.name;
            recipeCard.appendChild(title);

            // 레시피 설명
            const description = document.createElement('p');
            description.textContent = recipe.description;
            recipeCard.appendChild(description);

            // 재료 목록
            const ingredients = document.createElement('p');
            ingredients.textContent = `재료: ${recipe.ingredients}`;
            recipeCard.appendChild(ingredients);

            // 조리 시간
            const totalTime = document.createElement('p');
            totalTime.textContent = `조리 시간: ${recipe.total_time}`;
            recipeCard.appendChild(totalTime);

            // 레시피 보기 버튼
            const button = document.createElement('a');
            button.href = `/recipe/${recipe.recipe_id}`;
            button.textContent = '레시피 보기';
            button.classList.add('view-recipe-button');
            recipeCard.appendChild(button);

            return recipeCard;
        }

        // 검색 기능
        document.querySelector('#searchButton').addEventListener('click', () => {
            const query = document.querySelector('#searchInput').value.trim().toLowerCase().replace(/\s+/g, ''); // 띄어쓰기 무시
            const resultsDiv = document.querySelector('#searchResults');
            const recipeList = document.querySelector('.recipe-list');
            resultsDiv.innerHTML = ''; // 이전 검색 결과 초기화

            // 검색어가 없으면 모든 레시피를 표시
            if (!query) {
                recipeList.style.display = 'grid'; // 모든 레시피 보이기
                return;
            }

            // 검색된 레시피만 보이도록 필터링
            const filteredRecipes = recipeData.filter(recipe => {
                const recipeName = recipe.name.replace(/\s+/g, '').toLowerCase();
                const recipeIngredients = recipe.ingredients.replace(/\s+/g, '').toLowerCase();
                return recipeName.includes(query) || recipeIngredients.includes(query);
            });

            // 필터링된 레시피가 없으면 검색 결과 없음
            if (filteredRecipes.length === 0) {
                resultsDiv.innerHTML = '<p>검색 결과가 없습니다.</p>';
            } else {
                recipeList.style.display = 'none'; // 모든 레시피 숨기기
                filteredRecipes.forEach(recipe => {
                    const recipeCard = createRecipeCard(recipe);
                    resultsDiv.appendChild(recipeCard);
                    recipeCard.style.display = 'block'; // 검색된 레시피 보이기
                });
            }
        });
    </script>
</body>
</html>
